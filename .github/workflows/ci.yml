# Проверка каждого пуша и пулл-реквеста: типы, тесты, сборка, упаковка .vsix.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # Банк задач проверяет Dart-задачи настоящим dart (Python 3 на раннере уже есть).
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package -w codearena
