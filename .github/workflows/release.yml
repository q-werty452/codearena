# Публикация: git tag v0.1.0 && git push --tags
#   Visual Studio Marketplace — Trusted Publishing (OIDC), без токенов в репозитории;
#     включается переменной PUBLISH_MARKETPLACE=true (когда готов publisher).
#   Open VSX — секрет OVSX_PAT (первая публикация), потом можно Trusted Publishing.
#   GitHub Releases — .vsix для установки вручную.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Version in package.json matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./packages/extension/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run package -w codearena
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/extension/*.vsix
          if-no-files-found: error

  marketplace:
    needs: build
    # Включается переменной репозитория: gh variable set PUBLISH_MARKETPLACE --body true
    if: vars.PUBLISH_MARKETPLACE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath *.vsix

  openvsx:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Create the namespace (first release only)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.4.0 create-namespace q-werty452 || echo "namespace already exists"
      - run: npx --yes ovsx@1.4.0 publish *.vsix

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - run: gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "CodeArena $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
